[project]
name = "mailguard-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "SIM905"]  # Hebrew/Unicode text is intentional; word lists read better as split strings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/i18n.py" = ["E501"]  # translation tables: one entry per line reads better than wrapped strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
